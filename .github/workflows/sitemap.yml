name: Auto-update sitemap.xml

on:
  push:
    branches: [main]
    paths:
      - '**.html'
      - 'generate-sitemap.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: auto-commit-main
  cancel-in-progress: false

jobs:
  sitemap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate sitemap.xml
        run: python generate-sitemap.py

      - name: Commit changes
        run: |
          if [ -z "$(git status --porcelain sitemap.xml)" ]; then
            echo "No change to sitemap.xml"
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml
          git commit -m "chore: auto-update sitemap.xml"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            echo "push attempt $i failed, retrying after backoff..."; sleep $((RANDOM % 5 + 2))
          done
          echo "push failed after 5 attempts"; exit 1
